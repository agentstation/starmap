# Wan-AI/Wan2.2-T2V-A14B - Wan2.2 T2V A14B is a 14B-parameter text-to-video model by Wa...
id: Wan-AI/Wan2.2-T2V-A14B
model: alibaba/wan2.2-t2v-a14b
name: Wan-AI/Wan2.2-T2V-A14B
description: |-
  Wan2.2 T2V A14B is a 14B-parameter text-to-video model by Wan-AI with a Mixture-of-Experts design: a high-noise expert lays out the scene and motion, and a low-noise expert refines the detail. It generates 5-second 720p (1280×720) clips at 16 fps from text prompts.

