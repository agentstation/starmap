# moonshotai/Kimi-K2.6 - Kimi multimodal agent model for visual understanding, coding...
id: moonshotai/Kimi-K2.6
model: moonshot-ai/kimi-k2.6
name: moonshotai/Kimi-K2.6
authors:
- id: moonshot-ai
  name: moonshot-ai
description: Kimi multimodal agent model for visual understanding, coding, and planning

# Model metadata
metadata:
  release_date: 2026-04-21
  open_weights: true
  knowledge_cutoff: 2024-04-01
  tags:
  - chat
  - vlm
  - vision
  - prompt_cache
  - reasoning
lineage:
  family: kimi-k2
  root: moonshotai/Kimi-K2.6

# Model features
features:
  modalities:
    input:
    - text
    - image
    - video
    output:
    - text

  # Core capabilities
  tool_calls: true
  tools: true
  tool_choice: true
  web_search: false
  attachments: true

  # Reasoning & Verbosity
  reasoning: true
  reasoning_effort: false
  reasoning_tokens: false
  include_reasoning: false
  verbosity: false

  # Generation control support flags
  temperature: true
  top_p: true
  top_k: false
  top_a: false
  min_p: false
  typical_p: false
  tfs: false
  max_tokens: true
  max_output_tokens: false
  stop: true
  stop_token_ids: false
  frequency_penalty: false
  presence_penalty: false
  repetition_penalty: false
  no_repeat_ngram_size: false
  length_penalty: false
  logit_bias: false
  bad_words: false
  allowed_tokens: false
  seed: false
  logprobs: false
  top_logprobs: false
  echo: false
  "n": false
  best_of: false
  mirostat: false
  mirostat_tau: false
  mirostat_eta: false
  contrastive_search_penalty_alpha: false
  num_beams: false
  early_stopping: false
  diversity_penalty: false

  # Response delivery
  format_response: false
  structured_outputs: true
  streaming: true

# Model pricing
pricing:
  tokens:
    cache_read:
      per_1m: 0.15
    input:
      per_1m: 0.75
    output:
      per_1m: 3.5
  currency: USD

# Model limits
limits:
  context_window: 262144
  input_tokens: 0
  output_tokens: 262144
extensions:
  models.dev:
    fields:
      interleaved:
        enabled: true
        field: reasoning_content
      reasoning_options:
      - type: toggle

