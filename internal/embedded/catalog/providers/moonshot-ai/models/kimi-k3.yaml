# kimi-k3 - Multimodal Kimi model with 1M context and toggleable max-eff...
id: kimi-k3
model: moonshot-ai/kimi-k3
name: kimi-k3
authors:
- id: moonshot-ai
  name: moonshot-ai
description: Multimodal Kimi model with 1M context and toggleable max-effort thinking for long-horizon agent work

# Model metadata
metadata:
  release_date: 2026-07-16
  open_weights: true
lineage:
  family: kimi-k3

# Model features
features:
  modalities:
    input:
    - text
    - image
    - video
    output:
    - text

  # Core capabilities
  tool_calls: true
  tools: true
  tool_choice: true
  web_search: false
  attachments: true

  # Reasoning & Verbosity
  reasoning: true
  reasoning_effort: true
  reasoning_tokens: false
  include_reasoning: false
  verbosity: false

  # Generation control support flags
  temperature: true
  top_p: true
  top_k: false
  top_a: false
  min_p: false
  typical_p: false
  tfs: false
  max_tokens: true
  max_output_tokens: false
  stop: true
  stop_token_ids: false
  frequency_penalty: false
  presence_penalty: false
  repetition_penalty: false
  no_repeat_ngram_size: false
  length_penalty: false
  logit_bias: false
  bad_words: false
  allowed_tokens: false
  seed: false
  logprobs: false
  top_logprobs: false
  echo: false
  "n": false
  best_of: false
  mirostat: false
  mirostat_tau: false
  mirostat_eta: false
  contrastive_search_penalty_alpha: false
  num_beams: false
  early_stopping: false
  diversity_penalty: false

  # Response delivery
  format_response: false
  structured_outputs: true
  streaming: true
reasoning:
  levels:
  - low
  - high
  - maximum
  default: null

# Model pricing
pricing:
  tokens:
    cache_read:
      per_1m: 0.3
    input:
      per_1m: 3.0
    output:
      per_1m: 15.0
  currency: USD

# Model limits
limits:
  context_window: 1048576
  output_tokens: 131072
extensions:
  models.dev:
    fields:
      interleaved:
        field: reasoning_content
      reasoning_options:
      - type: toggle
      - type: effort
        values:
        - low
        - high
        - max
  moonshot-ai:
    fields:
      permission:
      - group: staff
        organization: staff
      unknown_fields:
      - checksum: sha256:e9f48e5552177ba95d03b5b5e93a30ae1bcf7b00a3e6c18c89adae14f305edd9
        path: data[].reasoning_efforts
      - checksum: sha256:b5bea41b6c623f7c09f1bf24dcae58ebab3c0cdd90ad966bc43a45b44867e12b
        path: data[].supports_dynamic_tools
      - checksum: sha256:c67679b3d00124ec167588721929982d2111cad05b1352fdb833058e9559a175
        path: data[].supports_thinking_type
      - checksum: sha256:e9f48e5552177ba95d03b5b5e93a30ae1bcf7b00a3e6c18c89adae14f305edd9
        path: data[].think_efforts

