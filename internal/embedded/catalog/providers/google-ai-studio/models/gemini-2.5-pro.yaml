# gemini-2.5-pro - Google's proven reasoning model for coding, math, and multim...
id: gemini-2.5-pro
model: google/gemini-2.5-pro
name: Gemini 2.5 Pro
authors:
- id: google
  name: Google
description: Google's proven reasoning model for coding, math, and multimodal analysis

# Model metadata
metadata:
  release_date: 2025-06-17
  open_weights: false
  knowledge_cutoff: 2025-01-01
  tags:
  - ocr
lineage:
  family: gemini-pro

# Model features
features:
  modalities:
    input:
    - text
    - image
    - audio
    - video
    - pdf
    output:
    - text

  # Core capabilities
  tool_calls: true
  tools: true
  tool_choice: true
  web_search: false
  attachments: true

  # Reasoning & Verbosity
  reasoning: true
  reasoning_effort: false
  reasoning_tokens: true
  include_reasoning: false
  verbosity: false

  # Generation control support flags
  temperature: true
  top_p: true
  top_k: true
  top_a: false
  min_p: false
  typical_p: false
  tfs: false
  max_tokens: true
  max_output_tokens: false
  stop: false
  stop_token_ids: false
  frequency_penalty: false
  presence_penalty: false
  repetition_penalty: false
  no_repeat_ngram_size: false
  length_penalty: false
  logit_bias: false
  bad_words: false
  allowed_tokens: false
  seed: false
  logprobs: false
  top_logprobs: false
  echo: false
  "n": false
  best_of: false
  mirostat: false
  mirostat_tau: false
  mirostat_eta: false
  contrastive_search_penalty_alpha: false
  num_beams: false
  early_stopping: false
  diversity_penalty: false

  # Response delivery
  format_response: false
  structured_outputs: true
  streaming: false
generation:
  temperature:
    min: 0.0
    max: 2.0
    default: 1.0
  top_p:
    min: 0.0
    max: 1.0
    default: 0.95
reasoning_tokens:
  min: 128
  max: 32768
  default: 0

# Model pricing
pricing:
  tokens:
    input:
      per_1m: 1.25
    output:
      per_1m: 10.00
  operations:
    page_input: 0.0003225
  currency: USD

# Model limits
limits:
  context_window: 1048576
  input_tokens: 1048576
  output_tokens: 65536
  document_pages: 1000
extensions:
  google-ai-studio:
    fields:
      supported_actions:
      - generateContent
      - countTokens
      - createCachedContent
      - batchGenerateContent
      supported_generation_methods:
      - generateContent
      - countTokens
      - createCachedContent
      - batchGenerateContent
      thinking: true
      version: "2.5"

