# lyria-3-pro-preview - Music generation model for full-length songs from text or im...
id: lyria-3-pro-preview
model: google/lyria-3-pro-preview
name: Lyria 3 Pro Preview
authors:
- id: google
  name: Google
description: Music generation model for full-length songs from text or images with vocals and structure

# Model metadata
metadata:
  release_date: 2026-03-25
  open_weights: false
lineage:
  family: lyria

# Model features
features:
  modalities:
    input:
    - text
    - image
    output:
    - text
    - audio

  # Core capabilities
  tool_calls: false
  tools: false
  tool_choice: false
  web_search: false
  attachments: true

  # Reasoning & Verbosity
  reasoning: false
  reasoning_effort: false
  reasoning_tokens: false
  include_reasoning: false
  verbosity: false

  # Generation control support flags
  temperature: true
  top_p: true
  top_k: true
  top_a: false
  min_p: false
  typical_p: false
  tfs: false
  max_tokens: true
  max_output_tokens: false
  stop: false
  stop_token_ids: false
  frequency_penalty: false
  presence_penalty: false
  repetition_penalty: false
  no_repeat_ngram_size: false
  length_penalty: false
  logit_bias: false
  bad_words: false
  allowed_tokens: false
  seed: false
  logprobs: false
  top_logprobs: false
  echo: false
  "n": false
  best_of: false
  mirostat: false
  mirostat_tau: false
  mirostat_eta: false
  contrastive_search_penalty_alpha: false
  num_beams: false
  early_stopping: false
  diversity_penalty: false

  # Response delivery
  format_response: false
  structured_outputs: false
  streaming: false
generation:
  temperature:
    min: 0.0
    max: 2.0
    default: 1.0
  top_p:
    min: 0.0
    max: 1.0
    default: 0.95

# Model pricing
pricing:
  tokens:
    input: {}
    output: {}
  currency: USD

# Model limits
limits:
  context_window: 1048576
  input_tokens: 1048576
  output_tokens: 65536
extensions:
  google-ai-studio:
    fields:
      supported_actions:
      - generateContent
      - countTokens
      supported_generation_methods:
      - generateContent
      - countTokens
      version: lyria-3-pro-preview

# Timestamps
created_at: 2026-07-11T20:15:12.209029Z
updated_at: 2026-07-30T16:49:34.921972Z
