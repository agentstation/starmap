# veo-3.1-lite-generate-preview - Video model for prompt-guided generation, editing, and motio...
id: veo-3.1-lite-generate-preview
model: google/veo-3.1-lite-generate-preview
name: Veo 3.1 lite
authors:
- id: google
  name: Google
description: Video model for prompt-guided generation, editing, and motion workflows

# Model metadata
metadata:
  release_date: 2026-03-31
  open_weights: false
lineage:
  family: veo

# Model features
features:
  modalities:
    input:
    - text
    - image
    output:
    - text
    - video

  # Core capabilities
  tool_calls: false
  tools: false
  tool_choice: false
  web_search: false
  attachments: true

  # Reasoning & Verbosity
  reasoning: false
  reasoning_effort: false
  reasoning_tokens: false
  include_reasoning: false
  verbosity: false

  # Generation control support flags
  temperature: false
  top_p: false
  top_k: false
  top_a: false
  min_p: false
  typical_p: false
  tfs: false
  max_tokens: false
  max_output_tokens: false
  stop: false
  stop_token_ids: false
  frequency_penalty: false
  presence_penalty: false
  repetition_penalty: false
  no_repeat_ngram_size: false
  length_penalty: false
  logit_bias: false
  bad_words: false
  allowed_tokens: false
  seed: false
  logprobs: false
  top_logprobs: false
  echo: false
  "n": false
  best_of: false
  mirostat: false
  mirostat_tau: false
  mirostat_eta: false
  contrastive_search_penalty_alpha: false
  num_beams: false
  early_stopping: false
  diversity_penalty: false

  # Response delivery
  format_response: false
  structured_outputs: false
  streaming: false

# Model limits
limits:
  context_window: 480
  input_tokens: 480
  output_tokens: 8192
extensions:
  google-ai-studio:
    fields:
      supported_actions:
      - predictLongRunning
      supported_generation_methods:
      - predictLongRunning
      version: "3.1"

