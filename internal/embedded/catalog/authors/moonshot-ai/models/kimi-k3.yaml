# kimi-k3 - Multimodal Kimi model with 1M context and toggleable max-eff...
id: kimi-k3
name: Kimi K3
authors:
- id: moonshot-ai
  name: Moonshot AI
description: Multimodal Kimi model with 1M context and toggleable max-effort thinking for long-horizon agent work

# Model metadata
metadata:
  release_date: 2026-07-16
  open_weights: true
lineage:
  family: kimi-k3

# Model features
features:
  modalities:
    input:
    - text
    - image
    - video
    output:
    - text

  # Core capabilities
  tool_calls: true
  tools: true
  tool_choice: true
  web_search: false
  attachments: true

  # Reasoning & Verbosity
  reasoning: true
  reasoning_effort: true
  reasoning_tokens: false
  include_reasoning: false
  verbosity: false

  # Generation control support flags
  temperature: false
  top_p: false
  top_k: false
  top_a: false
  min_p: false
  typical_p: false
  tfs: false
  max_tokens: false
  max_output_tokens: false
  stop: false
  stop_token_ids: false
  frequency_penalty: false
  presence_penalty: false
  repetition_penalty: false
  no_repeat_ngram_size: false
  length_penalty: false
  logit_bias: false
  bad_words: false
  allowed_tokens: false
  seed: false
  logprobs: false
  top_logprobs: false
  echo: false
  "n": false
  best_of: false
  mirostat: false
  mirostat_tau: false
  mirostat_eta: false
  contrastive_search_penalty_alpha: false
  num_beams: false
  early_stopping: false
  diversity_penalty: false

  # Response delivery
  format_response: false
  structured_outputs: true
  streaming: true
extensions:
  models.dev:
    fields:
      interleaved:
        field: reasoning_content
      reasoning_options:
      - type: toggle
      - type: effort
        values:
        - low
        - high
        - max

# Timestamps
created_at: 2026-07-16T00:00:00Z
updated_at: 2026-07-16T00:00:00Z
