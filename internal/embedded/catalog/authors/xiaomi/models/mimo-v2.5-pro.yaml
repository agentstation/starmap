description: Stronger MiMo Pro tier for multimodal reasoning and coding-agent execution

# Model metadata
metadata:
  release_date: 2026-04-22
  open_weights: true
  knowledge_cutoff: 2024-12-01
  tags:
  - chat
  - prompt_cache
  - reasoning
lineage:
