    endpoint:
      type: openai
      url: ""
      base_url_env_var: AZURE_OPENAI_ENDPOINT
      path: /openai/models
  status_page_url: https://azure.status.microsoft/en-us/status
  inference:
    base_url_env_var: AZURE_OPENAI_ENDPOINT
    endpoints:
    - operation: chat-completions
      type: openai
      path: /openai/v1/chat/completions
    - operation: embeddings
      type: openai
      path: /openai/v1/embeddings

# Cerebras
- id: cerebras
  name: Cerebras
  headquarters: Sunnyvale, CA, USA
  icon_url: https://cerebras.ai/favicon.ico
  api_key:
    name: CEREBRAS_API_KEY
    pattern: .*
    header: Authorization
    scheme: Bearer
    query_param: ""
  env_vars:
  - name: CEREBRAS_API_KEY
    required: false
  catalog:
    docs: https://inference-docs.cerebras.ai/models/overview
    auth:
      method: api-key
      required: true
    endpoint:
      type: openai
      url: https://api.cerebras.ai/v1/models
      feature_rules:
      - field: id
        contains:
        - llama
        feature: tools
        value: true
      - field: id
        contains:
        - r1
        feature: reasoning
        value: true
      author_mapping:
        field: owned_by
        normalized:
          Alibaba: alibaba
          DeepSeek: deepseek
          Meta: meta
          OpenAI: openai
    authors:
    - alibaba
    - meta
    - openai
  status_page_url: https://status.cerebras.ai/
  inference:
    base_url: https://api.cerebras.ai
    endpoints:
    - operation: chat-completions
      type: openai
      path: /v1/chat/completions
