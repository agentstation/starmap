      - OPENAI_ORG_ID
      - OPENAI_ORGANIZATION
    profiles:
    - id: api-key
      primitive: api-key
      fields:
      - api-key
      - organization
      placements:
      - field: api-key
        kind: header
        name: Authorization
        scheme: bearer
      - field: organization
        kind: header
        name: OpenAI-Organization
        scheme: direct
    catalog_acquisition:
      required: true
      alternatives:
      - api-key
    inference:
      required: true
      alternatives:
      - api-key
  catalog:
    docs: https://platform.openai.com/docs/models
    endpoint:
