# Alibaba Cloud Model Studio
- id: alibaba
  aliases:
  - alibaba-cloud
  - alibaba-model-studio
  - dashscope
  - model-studio
  - qwen
  name: Alibaba Cloud Model Studio
  description: Alibaba Cloud Model Studio serves the Qwen model family and partner models over an OpenAI-compatible API.
  docs_url: https://www.alibabacloud.com/help/en/model-studio/
  headquarters: Hangzhou, China
  icon_url: https://www.alibabacloud.com/favicon.ico
  credentials:
    fields:
    - id: api-key
      kind: secret
      required: true
      environment:
      - DASHSCOPE_API_KEY
    - id: base-url
      kind: parameter
      required: true
      environment:
      - ALIBABA_MODEL_STUDIO_BASE_URL
      default: https://dashscope-us.aliyuncs.com/compatible-mode
    profiles:
    - id: api-key
      primitive: api-key
      fields:
      - api-key
      - base-url
      placements:
      - field: api-key
        kind: header
        name: Authorization
        scheme: bearer
      endpoint_bindings:
      - field: base-url
        variable: base_url
        format: url
    catalog_acquisition:
      required: true
      alternatives:
      - api-key
    inference:
      required: true
      alternatives:
      - api-key
  catalog:
    docs: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
    endpoint:
      type: openai
      url: "{base_url}/v1/models"
      protocol_options:
        openai:
          token_price_unit: usd-per-million-tokens
      author_mapping:
        field: id
        normalized:
          deepseek*: deepseek
          glm*: zhipu-ai
          kimi*: moonshot-ai
          minimax*: minimax
          qvq*: qwen
          qwen*: qwen
          qwq*: qwen
          wan*: alibaba
  inference:
    base_url: "{base_url}"
    endpoints:
    - operation: chat-completions
      type: openai
      path: /v1/chat/completions
  extensions:
    models.dev:
      fields:
        api: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
        npm: "@ai-sdk/openai-compatible"

# Anthropic
- id: anthropic
  name: Anthropic
  description: Anthropic serves the Claude model family with first-party APIs for messages, tools, and batch processing.
  docs_url: https://docs.anthropic.com/
  headquarters: San Francisco, CA, USA
  icon_url: https://www.anthropic.com/favicon.ico
  credentials:
    fields:
    - id: api-key
      kind: secret
      required: true
      environment:
      - ANTHROPIC_API_KEY
    profiles:
    - id: api-key
      primitive: api-key
      fields:
      - api-key
      placements:
      - field: api-key
        kind: header
        name: x-api-key
        scheme: direct
    catalog_acquisition:
      required: true
      alternatives:
      - api-key
    inference:
      required: true
      alternatives:
      - api-key
  catalog:
    docs: https://docs.anthropic.com/en/docs/about-claude/models/overview
    endpoint:
      type: anthropic
      url: https://api.anthropic.com/v1/models
      protocol_options:
        anthropic:
          version: "2023-06-01"
  status_page_url: https://status.anthropic.com
  inference:
    base_url: https://api.anthropic.com
    endpoints:
    - operation: chat-completions
      type: anthropic
      path: /v1/messages
    health_api_url: https://status.anthropic.com/api/v2/summary.json
    health_components:
    - id: k8w3r06qmzrp
      name: api.anthropic.com
  privacy_policy:
    privacy_policy_url: https://www.anthropic.com/privacy
    terms_of_service_url: https://www.anthropic.com/terms
    retains_data: true
    trains_on_data: false
  retention_policy:
    type: fixed
    duration: 720h0m0s #30 days
    details: API inputs and outputs are automatically deleted within 30 days unless required for policy enforcement or legal compliance
  governance_policy:
    moderation_required: false
    moderated: true
    moderator: anthropic
  extensions:
    models.dev:
      fields:
        npm: "@ai-sdk/anthropic"

# Azure OpenAI
- id: azure-openai
  aliases:
  - azure
  name: Azure OpenAI
  description: Microsoft Azure hosts OpenAI models with enterprise controls, regional deployments, and Azure identity.
  docs_url: https://learn.microsoft.com/azure/ai-services/openai/
  headquarters: Redmond, WA, USA
  icon_url: https://azure.microsoft.com/favicon.ico
  credentials:
    fields:
    - id: endpoint
      kind: parameter
      required: true
      environment:
      - AZURE_OPENAI_ENDPOINT
      description: Resource-specific Azure OpenAI endpoint
    - id: api-key
      kind: secret
      required: true
      environment:
      - AZURE_OPENAI_API_KEY
    - id: access-token
      kind: secret
      required: true
    profiles:
    - id: api-key
      primitive: api-key
      fields:
      - endpoint
      - api-key
      placements:
      - field: api-key
        kind: header
        name: api-key
        scheme: direct
      endpoint_bindings:
      - field: endpoint
        variable: endpoint
        format: url
    - id: workload-identity
      primitive: azure-default
      fields:
      - endpoint
      - access-token
      placements:
      - field: access-token
        kind: header
        name: Authorization
        scheme: bearer
      scopes:
      - https://cognitiveservices.azure.com/.default
      endpoint_bindings:
      - field: endpoint
        variable: endpoint
        format: url
    catalog_acquisition:
      required: true
      alternatives:
      - api-key
      - workload-identity
    inference:
      required: true
      alternatives:
      - api-key
      - workload-identity
  catalog:
    docs: https://learn.microsoft.com/azure/ai-services/openai/how-to/working-with-models
    endpoint:
      type: openai
      url: "{endpoint}/openai/models"
      protocol_options:
        openai:
          token_price_unit: usd-per-million-tokens
  status_page_url: https://azure.status.microsoft/en-us/status
  inference:
    base_url: "{endpoint}"
    endpoints:
    - operation: chat-completions
      type: openai
      path: /openai/v1/chat/completions
    - operation: embeddings
      type: openai
      path: /openai/v1/embeddings

