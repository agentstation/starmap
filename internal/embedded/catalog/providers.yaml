# Alibaba Cloud Model Studio
- id: alibaba
  aliases:
  - alibaba-cloud
  - alibaba-model-studio
  - dashscope
  - model-studio
  - qwen
  name: Alibaba Cloud Model Studio
  headquarters: Hangzhou, China
  icon_url: https://www.alibabacloud.com/favicon.ico
  api_key:
    name: DASHSCOPE_API_KEY
    pattern: .*
    header: Authorization
    scheme: Bearer
    query_param: ""
  env_vars:
  - name: DASHSCOPE_API_KEY
    required: false
  catalog:
    docs: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
    auth:
      method: api-key
      required: true
    endpoint:
      type: openai
      url: https://dashscope-us.aliyuncs.com/compatible-mode/v1/models
      base_url_env_var: ALIBABA_MODEL_STUDIO_BASE_URL
      path: /models
      author_mapping:
        field: id
        normalized:
          deepseek*: deepseek
          glm*: zhipu-ai
          kimi*: moonshot-ai
          minimax*: minimax
          qvq*: qwen
          qwen*: qwen
          qwq*: qwen
          wan*: alibaba
  inference:
    base_url: https://dashscope-us.aliyuncs.com/compatible-mode
    endpoints:
    - operation: chat-completions
      type: openai
      path: /v1/chat/completions
  extensions:
    models.dev:
      fields:
        api: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
        npm: "@ai-sdk/openai-compatible"

# Anthropic
- id: anthropic
  name: Anthropic
  headquarters: San Francisco, CA, USA
  icon_url: https://www.anthropic.com/favicon.ico
  api_key:
    name: ANTHROPIC_API_KEY
    pattern: .*
    header: x-api-key
    scheme: ""
    query_param: ""
  env_vars:
  - name: ANTHROPIC_API_KEY
    required: false
  catalog:
    docs: https://docs.anthropic.com/en/docs/about-claude/models/overview
    auth:
      method: api-key
      required: true
    endpoint:
      type: anthropic
      url: https://api.anthropic.com/v1/models
  status_page_url: https://status.anthropic.com
  inference:
    base_url: https://api.anthropic.com
    endpoints:
    - operation: chat-completions
      type: anthropic
      path: /v1/messages
    health_api_url: https://status.anthropic.com/api/v2/summary.json
    health_components:
    - id: k8w3r06qmzrp
      name: api.anthropic.com
  privacy_policy:
    privacy_policy_url: https://www.anthropic.com/privacy
    terms_of_service_url: https://www.anthropic.com/terms
    retains_data: true
    trains_on_data: false
  retention_policy:
    type: fixed
    duration: 720h0m0s #30 days
    details: API inputs and outputs are automatically deleted within 30 days unless required for policy enforcement or legal compliance
  governance_policy:
    moderation_required: false
    moderated: true
    moderator: anthropic
  extensions:
    models.dev:
      fields:
        npm: "@ai-sdk/anthropic"

# Azure OpenAI
- id: azure-openai
  aliases:
  - azure
  name: Azure OpenAI
  headquarters: Redmond, WA, USA
  icon_url: https://azure.microsoft.com/favicon.ico
  env_vars:
  - name: AZURE_OPENAI_ENDPOINT
    required: true
    description: Resource-specific Azure OpenAI endpoint
