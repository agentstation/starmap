    moderated: true
    moderator: google-ai-studio
  extensions:
    models.dev:
      fields:
        npm: "@ai-sdk/google"

# Google Vertex AI
- id: google-vertex
  name: Google Vertex AI
  description: Google Vertex AI hosts Gemini and partner models with enterprise controls on Google Cloud.
  docs_url: https://cloud.google.com/vertex-ai/docs
  headquarters: Mountain View, CA, USA
  icon_url: https://www.gstatic.com/marketing-cms/assets/images/29/8c/e1f2c0994e87b8d7edf2886f9c02/google-cloud.webp
  credentials:
    fields:
    - id: access-token
      kind: secret
      required: true
    - id: project
      kind: parameter
      required: true
      environment:
      - GOOGLE_CLOUD_PROJECT
      - GOOGLE_VERTEX_PROJECT
      description: GCP project ID; default credentials can supply it
    - id: location
      kind: parameter
      required: true
      environment:
      - GOOGLE_CLOUD_LOCATION
      - GOOGLE_CLOUD_REGION
      - GOOGLE_VERTEX_LOCATION
      default: us-central1
    profiles:
    - id: workload-identity
      primitive: google-default
      fields:
      - access-token
      - project
      - location
      placements:
      - field: access-token
        kind: header
        name: Authorization
        scheme: bearer
      scopes:
      - https://www.googleapis.com/auth/cloud-platform
      protocol_options:
        google_default:
          project_field: project
      endpoint_bindings:
      - field: project
        variable: project
        format: path-segment
      - field: location
        variable: location
        format: path-segment
    catalog_acquisition:
      required: true
      alternatives:
      - workload-identity
    inference:
      required: true
      alternatives:
      - workload-identity
  catalog:
    docs: https://cloud.google.com/vertex-ai/generative-ai/docs/model-reference/inference
    endpoint:
      type: google-cloud
      url: https://{location}-aiplatform.googleapis.com/v1/projects/{project}/locations/{location}/models
      author_mapping:
        field: publisher
        normalized:
          ai21: ai21
          anthropic: anthropic
          deepseek-ai: deepseek
          google: google
          meta: meta
          mistralai: mistral
          openai: openai
          qwen: qwen
  status_page_url: https://status.cloud.google.com
  inference:
    base_url: https://{location}-aiplatform.googleapis.com
    endpoints:
    - operation: chat-completions
      type: google-cloud
      path: /v1/projects/{project}/locations/{location}/publishers/{publisher}/models/{provider_model_id}:generateContent
      stream_path: /v1/projects/{project}/locations/{location}/publishers/{publisher}/models/{provider_model_id}:streamGenerateContent
      protocols_by_author:
        anthropic: anthropic
      paths_by_author:
        anthropic: /v1/projects/{project}/locations/{location}/publishers/{publisher}/models/{provider_model_id}:rawPredict
      stream_paths_by_author:
        anthropic: /v1/projects/{project}/locations/{location}/publishers/{publisher}/models/{provider_model_id}:streamRawPredict
    - operation: embeddings
      type: google-cloud
      path: /v1/projects/{project}/locations/{location}/publishers/{publisher}/models/{provider_model_id}:predict
  privacy_policy:
    privacy_policy_url: https://cloud.google.com/privacy
    terms_of_service_url: https://cloud.google.com/terms
    retains_data: true
    trains_on_data: false
  retention_policy:
    type: fixed
    duration: 48h0m0s #2 days
    details: Data retention period not specified in privacy policy; estimated 48 hours based on typical Google Cloud practices; enterprise customers may configure longer periods
  governance_policy:
    moderation_required: false
    moderated: true
    moderator: google-vertex
  extensions:
    models.dev:
      fields:
        npm: "@ai-sdk/google-vertex"

