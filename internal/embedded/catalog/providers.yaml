# DeepInfra
- id: deepinfra
  name: DeepInfra
  description: DeepInfra serves open-weight models over an OpenAI-compatible API with per-token pricing.
  docs_url: https://deepinfra.com/docs
  headquarters: San Francisco, CA, USA
  icon_url: https://deepinfra.com/favicon.ico
  credentials:
    fields:
    - id: api-key
      kind: secret
      required: true
      environment:
      - DEEPINFRA_API_KEY
      - DEEPINFRA_TOKEN
    profiles:
    - id: public
      primitive: none
    - id: api-key
      primitive: api-key
      fields:
      - api-key
      placements:
      - field: api-key
        kind: header
        name: Authorization
        scheme: bearer
    catalog_acquisition:
      required: false
      alternatives:
      - public
    inference:
      required: true
      alternatives:
      - api-key
  catalog:
    docs: https://docs.deepinfra.com/chat/overview
    endpoint:
      type: openai
      url: https://api.deepinfra.com/v1/openai/models
      protocol_options:
        openai:
          token_price_unit: usd-per-million-tokens
      field_mappings:
      - from: metadata.description
        to: description
      - from: metadata.context_length
        to: limits.context_window
      - from: metadata.tags
        to: metadata.tags
      author_mapping:
        field: id
        normalized:
          01-ai/*: 01.ai
          BAAI/*: baai
          ByteDance/*: bytedance
          MiniMaxAI/*: minimax
          NousResearch/*: nousresearch
          Qwen/*: qwen
          cognitivecomputations/*: cognitivecomputations
          deepseek-ai/*: deepseek
          google/*: google
          meta-llama/*: meta
          microsoft/*: microsoft
          mistralai/*: mistral
          moonshotai/*: moonshot-ai
          nvidia/*: nvidia
          openai/*: openai
          zai-org/*: zhipu-ai
  inference:
    base_url: https://api.deepinfra.com/v1/openai
    endpoints:
    - operation: chat-completions
      type: openai
      path: /chat/completions
  extensions:
    models.dev:
      fields:
        npm: "@ai-sdk/deepinfra"

