      url: https://api.openai.com/v1/models
      protocol_options:
        openai:
          token_price_unit: usd-per-million-tokens
      author_mapping:
        field: owned_by
        normalized:
          system: openai
  status_page_url: https://status.openai.com
  inference:
    base_url: https://api.openai.com
    endpoints:
    - operation: chat-completions
      type: openai
      path: /v1/chat/completions
    - operation: embeddings
      type: openai
      path: /v1/embeddings
    health_api_url: https://status.openai.com/api/v2/summary.json
    health_components:
    - id: 01JMXBRMFE6N2NNT7DG6XZQ6PW
      name: Chat
  privacy_policy:
    privacy_policy_url: https://openai.com/privacy
    terms_of_service_url: https://openai.com/terms
    retains_data: true
    trains_on_data: false
  retention_policy:
    type: conditional
    duration: 720h0m0s #30 days
    details: "Standard policy: API data retained for 30 days for abuse monitoring. However, due to The New York Times copyright lawsuit, OpenAI is under court order to preserve ChatGPT output data indefinitely. OpenAI is appealing these preservation orders, arguing they conflict with privacy commitments to users. Current legal proceedings may require indefinite data retention regardless of stated policy."
  governance_policy:
    moderation_required: false
    moderated: true
    moderator: openai
  extensions:
    models.dev:
      fields:
        npm: "@ai-sdk/openai"

# Ollama
- id: ollama
  name: Ollama
  description: Ollama runs open-weight models locally and exposes an OpenAI-compatible API.
  docs_url: https://docs.ollama.com/
  icon_url: https://ollama.com/public/ollama.png
  credentials:
    fields:
    - id: base-url
      kind: parameter
      required: true
      environment:
      - OLLAMA_BASE_URL
      default: http://localhost:11434
      description: Local or remote Ollama server base URL
    profiles:
    - id: unauthenticated
      primitive: none
      fields:
      - base-url
      endpoint_bindings:
      - field: base-url
        variable: base_url
        format: url
    inference:
      required: false
      alternatives:
      - unauthenticated
  inference:
    base_url: "{base_url}"
    endpoints:
    - operation: chat-completions
      type: ollama
      path: /api/chat
    - operation: embeddings
      type: ollama
      path: /api/embed
