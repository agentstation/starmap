services:
  starmap:
    image: ghcr.io/agentstation/starmap:latest
    container_name: starmap-server
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]

    # HTTP server port
    ports:
      - "8080:8080"

    # Environment variables
    # Copy .env.example to .env and customize
    environment:
      # Server configuration
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080

      # Catalog settings (optional). This stack sets none, so the server pulls
      # the public attested channel with the defaults below. Each line names one
      # canonical setting and its default. A flag of the same name in kebab case
      # overrides the setting for one command.
      # - STARMAP_CATALOG_SOURCE=public
      # - STARMAP_CATALOG_SOURCE_URL=
      # - STARMAP_CATALOG_SOURCE_API_KEY=
      # - STARMAP_CATALOG_SOURCE_REPOSITORY=agentstation/starmap
      # - STARMAP_CATALOG_SOURCE_CHANNEL=catalog-latest
      # - STARMAP_CATALOG_SOURCE_SIGNER_WORKFLOW=
      # - STARMAP_CATALOG_SOURCE_TOKEN=
      # - STARMAP_CATALOG_SOURCE_POLL_INTERVAL=1h
      # - STARMAP_CATALOG_SOURCE_STARTUP_POLICY=prefer_source
      # - STARMAP_CATALOG_SOURCE_MAX_AGE=6h
      # - STARMAP_CATALOG_SOURCE_MAX_HOPS=8
      # - STARMAP_CATALOG_SOURCE_ALIASES=replica-a,catalog.example.com
      # - STARMAP_CATALOG_ACQUISITION_ENABLED=true
      # - STARMAP_CATALOG_ACQUISITION_INTERVAL=4h
      # - STARMAP_CATALOG_COALESCE_WINDOW=30s
      # - STARMAP_CATALOG_WORKSPACE_PATH=/home/nonroot/.starmap/catalog
      # - STARMAP_CATALOG_STARTUP_SPREAD=15m
      # - STARMAP_CATALOG_TRANSFER_IDLE_TIMEOUT=2m
      # - STARMAP_CATALOG_TRANSFER_MAX_DURATION=60m
      # - STARMAP_CATALOG_REFRESH_TIMEOUT=0s
      # - STARMAP_STATE_DIR=/home/nonroot/.starmap/state/runtime
      # - STARMAP_SCHEDULER_IDENTITY=

      # Provider API keys (optional - for live data fetching)
      # Uncomment and set in .env file
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # - GROQ_API_KEY=${GROQ_API_KEY}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      # - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      # - ALIBABA_MODEL_STUDIO_BASE_URL=${ALIBABA_MODEL_STUDIO_BASE_URL}
      # - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      # - DEEPINFRA_TOKEN=${DEEPINFRA_TOKEN}

      # Google Vertex (optional)
      # - GOOGLE_VERTEX_PROJECT=${GOOGLE_VERTEX_PROJECT}
      # - GOOGLE_VERTEX_LOCATION=${GOOGLE_VERTEX_LOCATION}
      # - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json

    # Optional: Load environment from .env file
    env_file:
      - .env

    # The root filesystem stays read-only, so this volume holds the only
    # writable state. It carries the catalog workspace path and the runtime
    # state directory, so a durable catalog survives a restart. The mount point
    # is the home directory of the image, because the unprivileged user already
    # owns that directory. A deeper mount point would arrive owned by root and
    # the server could not write it.
    volumes:
      - starmap-data:/home/nonroot
      # Optional: Mount Google Cloud credentials
      # - ./secrets/gcp-key.json:/secrets/gcp-key.json:ro

    # Health check
    healthcheck:
      test: ["CMD", "/ko-app/starmap", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Restart policy
    restart: unless-stopped

    # Security: Run as nonroot user (UID 65532 in chainguard images)
    user: "65532:65532"

    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp

    # Security: Drop all capabilities
    cap_drop:
      - ALL

    # Security: No new privileges
    security_opt:
      - no-new-privileges:true

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  starmap-data:
    driver: local

# Networks (optional - for multi-service deployments)
# networks:
#   starmap-net:
#     driver: bridge
