services:
  starmap:
    image: ghcr.io/agentstation/starmap:latest
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]

    # HTTP server port
    ports:
      - "127.0.0.1:8080:8080"

    # Environment variables
    # Copy .env.example to .env and customize
    environment:
      # Explicit application roots inside the durable volume.
      - STARMAP_HOME=/home/nonroot/starmap

      # Server configuration
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080

      # Catalog settings (optional). This stack sets none, so the server pulls
      # the public attested channel with the defaults below. Each line names one
      # canonical setting and its default. A flag of the same name in kebab case
      # overrides the setting for one command.
      # - STARMAP_CATALOG_SOURCE=public
      # - STARMAP_CATALOG_SOURCE_URL=
      # - STARMAP_CATALOG_SOURCE_API_KEY=
      # - STARMAP_CATALOG_SOURCE_REPOSITORY=agentstation/starmap
      # - STARMAP_CATALOG_SOURCE_CHANNEL=catalog-latest
      # - STARMAP_CATALOG_SOURCE_SIGNER_WORKFLOW=
      # - STARMAP_CATALOG_SOURCE_TOKEN=
      # - STARMAP_CATALOG_SOURCE_POLL_INTERVAL=1h
      # - STARMAP_CATALOG_SOURCE_REFRESH_MODE=automatic
      # - STARMAP_CATALOG_NETWORK_MODE=configured
      # - STARMAP_CATALOG_SOURCE_STARTUP_POLICY=prefer_source
      # Internal authority requires both identities and qualified host clock evidence.
      # - STARMAP_CATALOG_SOURCE_AUTHORITY_ID=enterprise
      # - STARMAP_CATALOG_SOURCE_POLICY_ID=production
      # - STARMAP_CATALOG_SOURCE_MAX_AGE=6h
      # - STARMAP_CATALOG_SOURCE_MAX_HOPS=8
      # - STARMAP_CATALOG_SOURCE_ALIASES=replica-a,catalog.example.com
      # - STARMAP_CATALOG_ACQUISITION_ENABLED=true
      # - STARMAP_CATALOG_ACQUISITION_SOURCES=providers,local_catalog,models_dev_http
      # - STARMAP_CATALOG_MODELS_DEV_GIT_COMMIT=
      # - STARMAP_CATALOG_ACQUISITION_INTERVAL=4h
      # Empty bindings disable connected-runtime provider acquisition.
      # Manual update integration remains open. See docs/CATALOG_SETTINGS.md.
      # - STARMAP_CATALOG_PROVIDER_BINDINGS=[]
      # - STARMAP_CATALOG_COALESCE_WINDOW=30s
      # - STARMAP_CATALOG_WORKSPACE_PATH=/home/nonroot/starmap/data/catalog/workspace
      # - STARMAP_CATALOG_STARTUP_SPREAD=15m
      # - STARMAP_CATALOG_TRANSFER_IDLE_TIMEOUT=2m
      # - STARMAP_CATALOG_TRANSFER_MAX_DURATION=60m
      # - STARMAP_CATALOG_REFRESH_TIMEOUT=0s
      # - STARMAP_STATE_DIR=/home/nonroot/starmap/state/catalog/runtime/default
      # - STARMAP_SCHEDULER_IDENTITY=
      # Native permission time requires qualified bounds for this host.
      # Set the four cache bounds before selecting native. Windows needs three additional bounds.
      # See docs/CATALOG_SETTINGS.md. This example specifies no production error bounds.

      # Origin declarations replace as one object. Supply qualified native clock bounds.
      # - STARMAP_CATALOG_AUTHORITY_ORIGIN={"enabled":false}

      # - STARMAP_CATALOG_PERMISSION_CLOCK_SOURCE=disabled
      # STARMAP_CATALOG_PERMISSION_CLOCK_REFRESH_INTERVAL
      # STARMAP_CATALOG_PERMISSION_CLOCK_MAX_AGE
      # STARMAP_CATALOG_PERMISSION_CLOCK_MAX_DRIFT_PPM
      # STARMAP_CATALOG_PERMISSION_CLOCK_COUNTER_UNCERTAINTY
      # STARMAP_CATALOG_PERMISSION_CLOCK_WINDOWS_MAX_SOURCE_AGE
      # STARMAP_CATALOG_PERMISSION_CLOCK_WINDOWS_MAX_SOURCE_DRIFT_PPM
      # STARMAP_CATALOG_PERMISSION_CLOCK_WINDOWS_SOURCE_UNCERTAINTY

      # Provider API keys (optional - for live data fetching)
      # Uncomment and set in .env file
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # - GROQ_API_KEY=${GROQ_API_KEY}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      # - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      # - ALIBABA_MODEL_STUDIO_BASE_URL=${ALIBABA_MODEL_STUDIO_BASE_URL}
      # - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      # - DEEPINFRA_TOKEN=${DEEPINFRA_TOKEN}

      # Google Vertex (optional)
      # - GOOGLE_VERTEX_PROJECT=${GOOGLE_VERTEX_PROJECT}
      # - GOOGLE_VERTEX_LOCATION=${GOOGLE_VERTEX_LOCATION}
      # - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json

    # Optional: Load environment from .env file
    env_file:
      - .env

    # The image owns /home/nonroot as UID 65532. A fresh named volume inherits
    # that image directory. STARMAP_HOME explicitly selects the starmap child.
    # Existing volumes need operator review before a layout or ownership change.
    volumes:
      - starmap-data:/home/nonroot
      # Optional: Mount Google Cloud credentials
      # - ./secrets/gcp-key.json:/secrets/gcp-key.json:ro

    # Probe /health and /api/v1/ready through HTTP outside this shell-free image.

    # Restart policy
    restart: unless-stopped

    # Security: Run as nonroot user (UID 65532 in chainguard images)
    user: "65532:65532"

    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp

    # Security: Drop all capabilities
    cap_drop:
      - ALL

    # Security: No new privileges
    security_opt:
      - no-new-privileges:true

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  starmap-data:
    driver: local

# Networks (optional - for multi-service deployments)
# networks:
#   starmap-net:
#     driver: bridge
