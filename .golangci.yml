# golangci-lint configuration v2
version: "2"

run:
  timeout: 5m
  tests: false

issues:
  # Maximum issues to report
  max-issues-per-linter: 50
  max-same-issues: 10

linters:
  exclusions:
    # Analyze these paths but do not report their findings.
    paths:
      - "vendor/"
      - "scripts/"
      - "experiments/"
  
  enable:
    # Default linters
    - govet        # Reports suspicious constructs
    - errcheck     # Checks for unchecked errors
    - staticcheck  # Advanced static analysis
    - ineffassign  # Detects ineffectual assignments
    - unused       # Checks for unused code
    
    # Code quality
    - misspell     # Finds misspelled words
    - gosec        # Security checker
    - gocyclo      # Cyclomatic complexity checker
    - dupl         # Code duplication checker
    - revive       # Fast, configurable linter
    
    # Best practices
    - bodyclose    # Checks that code closes HTTP response bodies
    - noctx        # Finds sending HTTP request without context
    - unconvert    # Removes unnecessary type conversions
    - godot        # Checks comment punctuation
    
    # Performance
    - prealloc     # Suggests slice pre-allocation

  disable:
    - depguard     # Restricts general use too much.
    - gochecknoglobals # The project uses some globals.
    - gochecknoinits   # The project needs some init functions.
    - goconst          # Mechanical string constants can reduce local readability.
    - mnd          # Some numeric values are clear in context.
    - wsl          # Enforces excessive whitespace rules.
