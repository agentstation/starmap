# Public catalog publication policy. API keys remain in Actions secrets.
policy_version: starmap-public-v1
scopes:
  - source: models_dev_http
    required: true
    enabled: true
    allow_missing: false
    max_retained_age: 24h
    disabled_action: preserve

  - source: providers
    binding:
      schema_version: 2
      id: public-alibaba
      revision: public-v1
      provider_id: alibaba
      public: true
      region: default-endpoint
      api_surface: models
      membership_authority: scope
      credential_role: catalog_acquisition
      credential_profile_id: api-key
    required: false
    enabled: true
    allow_missing: true
    max_retained_age: 24h
    disabled_action: preserve

