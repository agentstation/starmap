version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    groups:
      github-actions:
        patterns:
          - "*"

  # The consumer modules under testdata are separate modules that reach the
  # root through a replace directive, so their requirements must move with the
  # root's. A root-only update leaves them stale and fails make test-pure-go.
  # Only the plural directories key supports a glob.
  - package-ecosystem: gomod
    directories:
      - /
      - /testdata/consumers/*
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    groups:
      go-modules:
        patterns:
          - "*"
        # Without this, Dependabot opens one pull request per directory, and a
        # root-only pull request cannot pass. This makes a pull request span
        # every directory that shares the dependency, so each one is internally
        # consistent.
        group-by: dependency-name
