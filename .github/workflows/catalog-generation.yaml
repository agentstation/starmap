name: Catalog Generation

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: catalog-generation-publisher
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # The publisher limits nest above the 60-minute catalog transfer bound. The
    # refresh step gets 75 minutes, and this job gets 90 minutes.
    timeout-minutes: 90
    env:
      # The discovery channel is a branch, not a release. GitHub freezes an
      # immutable release at creation, so a mutable pointer cannot live on one.
      CHANNEL_BRANCH: catalog/v1
      CHANNEL_FILE: channel.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The channel branch push reuses this checkout credential.
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Refresh candidate catalog
        timeout-minutes: 75
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STARMAP_GENERATION_NONINTERACTIVE: "1"
          STARMAP_GENERATION_REPORT_PATH: catalog-generation.json
          STARMAP_GENERATION_STATE_PATH: ${{ runner.temp }}/starmap-catalog-generation
          STARMAP_GENERATION_STORE_PATH: ${{ runner.temp }}/starmap-catalog-generation/update-home/.starmap/state/catalog
        run: ./scripts/generate-embedded-catalog.sh

      - name: Classify candidate catalog generation
        id: change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(jq -r .changed catalog-generation.json)
          PAYLOAD_CHECKSUM=$(jq -er .payload_checksum catalog-generation.json)
          CATALOG_CHECKSUM=$(jq -er .semantic_checksum catalog-generation.json)
          CATALOG_DIGEST=${CATALOG_CHECKSUM#sha256:}
          TAG=catalog-${CATALOG_DIGEST}
          GENERATION_ID=$(jq -er .generation_id catalog-generation.json)
          write_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }
          write_output changed "$CHANGED"
          write_output payload_checksum "$PAYLOAD_CHECKSUM"
          write_output catalog_checksum "$CATALOG_CHECKSUM"
          write_output tag "$TAG"
          write_output generation_id "$GENERATION_ID"

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING=${RUNNER_TEMP}/catalog-existing-release
            rm -rf "$EXISTING"
            mkdir -p "$EXISTING"
            gh release download "$TAG" --pattern 'starmap-catalog*' --dir "$EXISTING"
            gh attestation verify \
              "$EXISTING/starmap-catalog.tar.gz" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/catalog-generation.yaml" \
              --deny-self-hosted-runners
            go run ./cmd/starmap-catalog-release \
              --verify-dir "$EXISTING" > catalog-existing-verification.json
            test "$(jq -er .semantic_checksum catalog-existing-verification.json)" = "$CATALOG_CHECKSUM"
            write_output verified_directory "$EXISTING"
            write_output published_at "$(gh release view "$TAG" --json publishedAt --jq .publishedAt)"
            write_output publish false
            write_output reason "immutable catalog release already published and verified"
            exit 0
          fi

          gh release list --limit 100 --json tagName,isPrerelease,isDraft,publishedAt \
            > "${RUNNER_TEMP}/catalog-release-listing.json"
          PREVIOUS_TAG=""
          while IFS= read -r CANDIDATE_TAG; do
            CANDIDATE_DIRECTORY=$(mktemp -d)
            CANDIDATE_REPORT=${RUNNER_TEMP}/catalog-compatibility-${CANDIDATE_TAG}.json
            gh release download "$CANDIDATE_TAG" --pattern 'starmap-catalog*' --dir "$CANDIDATE_DIRECTORY"
            gh attestation verify \
              "$CANDIDATE_DIRECTORY/starmap-catalog.tar.gz" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/catalog-generation.yaml" \
              --deny-self-hosted-runners
            go run ./cmd/starmap-catalog-release \
              --inspect-dir "$CANDIDATE_DIRECTORY" > "$CANDIDATE_REPORT"
            if jq -e '.supports_current_schema == true' "$CANDIDATE_REPORT" >/dev/null; then
              PREVIOUS_TAG="$CANDIDATE_TAG"
              break
            fi
          done < <(go run ./cmd/starmap-catalog-release \
            --rollback-candidates "${RUNNER_TEMP}/catalog-release-listing.json" \
            --exclude-tag "$TAG" | jq -r '.candidates[].tag')
          write_output previous_tag "$PREVIOUS_TAG"

          write_output publish true
          write_output reason "the canonical immutable catalog release is not published"

      - name: Validate candidate catalog
        if: ${{ steps.change.outputs.changed == 'true' || steps.change.outputs.publish == 'true' }}
        run: |
          make catalog-generation-check
          make embedded-catalog-budget-check

      - name: Stage validated immutable generation
        if: ${{ steps.change.outputs.publish == 'true' }}
        id: assets
        run: |
          go run ./cmd/starmap-catalog-release \
            --generation-store "${RUNNER_TEMP}/starmap-catalog-generation/update-home/.starmap/state/catalog" \
            --output-dir dist/catalog-generation > catalog-release.json
          printf 'directory=%s\n' "$(jq -er .directory catalog-release.json)" >> "$GITHUB_OUTPUT"

      - name: Attest scheduled catalog generation
        if: ${{ steps.change.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ steps.assets.outputs.directory }}/starmap-catalog.tar.gz"

      - name: Verify scheduled catalog provenance
        if: ${{ steps.change.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "${{ steps.assets.outputs.directory }}/starmap-catalog.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/catalog-generation.yaml" \
            --deny-self-hosted-runners

      - name: Publish changed validated catalog generation
        if: ${{ steps.change.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.change.outputs.tag }}" \
            --prerelease \
            --title "Catalog ${{ steps.change.outputs.generation_id }}" \
            --notes "Immutable catalog ${{ steps.change.outputs.catalog_checksum }} with exact evidence payload ${{ steps.change.outputs.payload_checksum }}" \
            "${{ steps.assets.outputs.directory }}/starmap-catalog.tar.gz" \
            "${{ steps.assets.outputs.directory }}/starmap-catalog.tar.gz.sha256" \
            "${{ steps.assets.outputs.directory }}/starmap-catalog.intoto.json"

      - name: Verify downloaded public catalog prerelease
        if: ${{ steps.change.outputs.publish == 'true' }}
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.change.outputs.tag }}"
          STAGED_DIRECTORY=$(realpath "${{ steps.assets.outputs.directory }}")
          DOWNLOAD_DIRECTORY=${RUNNER_TEMP}/catalog-public-download
          rm -rf "$DOWNLOAD_DIRECTORY"
          mkdir -p "$DOWNLOAD_DIRECTORY"

          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = "true"
          gh release download "$TAG" --pattern 'starmap-catalog*' --dir "$DOWNLOAD_DIRECTORY"
          go run ./cmd/starmap-catalog-release --verify-dir "$DOWNLOAD_DIRECTORY" > catalog-public-verification.json
          test "$(jq -er .generation_id catalog-public-verification.json)" = "${{ steps.change.outputs.generation_id }}"
          test "$(jq -er .archive_checksum catalog-public-verification.json)" = "$(jq -er .archive_checksum catalog-release.json)"
          cmp "$STAGED_DIRECTORY/starmap-catalog.tar.gz" "$DOWNLOAD_DIRECTORY/starmap-catalog.tar.gz"
          cmp "$STAGED_DIRECTORY/starmap-catalog.tar.gz.sha256" "$DOWNLOAD_DIRECTORY/starmap-catalog.tar.gz.sha256"
          cmp "$STAGED_DIRECTORY/starmap-catalog.intoto.json" "$DOWNLOAD_DIRECTORY/starmap-catalog.intoto.json"
          gh attestation verify \
            "$DOWNLOAD_DIRECTORY/starmap-catalog.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/catalog-generation.yaml" \
            --deny-self-hosted-runners
          printf 'directory=%s\n' "$DOWNLOAD_DIRECTORY" >> "$GITHUB_OUTPUT"
          printf 'published_at=%s\n' \
            "$(gh release view "$TAG" --json publishedAt --jq .publishedAt)" >> "$GITHUB_OUTPUT"

      - name: Verify prior catalog prerelease remains readable
        if: ${{ steps.change.outputs.publish == 'true' && steps.change.outputs.previous_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG="${{ steps.change.outputs.previous_tag }}"
          ROLLBACK_DIRECTORY=${RUNNER_TEMP}/catalog-rollback-download
          rm -rf "$ROLLBACK_DIRECTORY"
          mkdir -p "$ROLLBACK_DIRECTORY"

          gh release download "$PREVIOUS_TAG" --pattern 'starmap-catalog*' --dir "$ROLLBACK_DIRECTORY"
          go run ./cmd/starmap-catalog-release --verify-dir "$ROLLBACK_DIRECTORY" > catalog-rollback-verification.json
          test -n "$(jq -er .generation_id catalog-rollback-verification.json)"
          gh attestation verify \
            "$ROLLBACK_DIRECTORY/starmap-catalog.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/catalog-generation.yaml" \
            --deny-self-hosted-runners

      - name: Read current catalog channel document
        id: channel_current
        run: |
          CURRENT_DIRECTORY=${RUNNER_TEMP}/catalog-channel-current
          rm -rf "$CURRENT_DIRECTORY"
          mkdir -p "$CURRENT_DIRECTORY"
          # Read the branch through git, never through raw.githubusercontent.com.
          # That host caches a changed file for minutes. An absent branch is the
          # first publication, and the sequence then starts at one.
          if git fetch --no-tags --depth=1 origin \
            "+refs/heads/${CHANNEL_BRANCH}:refs/remotes/origin/${CHANNEL_BRANCH}" 2>/dev/null; then
            git show "refs/remotes/origin/${CHANNEL_BRANCH}:${CHANNEL_FILE}" \
              > "${CURRENT_DIRECTORY}/${CHANNEL_FILE}"
          fi
          printf 'document=%s\n' "${CURRENT_DIRECTORY}/${CHANNEL_FILE}" >> "$GITHUB_OUTPUT"

      - name: Stage attested catalog channel document
        id: channel
        run: |
          VERIFIED_DIRECTORY="${{ steps.verified.outputs.directory || steps.change.outputs.verified_directory }}"
          PUBLISHED_AT="${{ steps.verified.outputs.published_at || steps.change.outputs.published_at }}"
          CHANNEL_DIRECTORY=${RUNNER_TEMP}/catalog-channel
          rm -rf "$CHANNEL_DIRECTORY"
          mkdir -p "$CHANNEL_DIRECTORY"

          test -n "$VERIFIED_DIRECTORY"
          test -n "$PUBLISHED_AT"
          go run ./cmd/starmap-catalog-release \
            --channel-release-dir "$VERIFIED_DIRECTORY" \
            --channel-tag "${{ steps.change.outputs.tag }}" \
            --channel-published-at "$PUBLISHED_AT" \
            --channel-current "${{ steps.channel_current.outputs.document }}" \
            --channel-out "${CHANNEL_DIRECTORY}/${CHANNEL_FILE}" \
            --channel-attestation-verified > catalog-channel.json
          {
            printf 'document=%s\n' "$(jq -er .document catalog-channel.json)"
            printf 'sequence=%s\n' "$(jq -er .sequence catalog-channel.json)"
            printf 'outcome=%s\n' "$(jq -er .outcome catalog-channel.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Attest catalog channel document
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ steps.channel.outputs.document }}"

      - name: Verify catalog channel provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "${{ steps.channel.outputs.document }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/catalog-generation.yaml" \
            --deny-self-hosted-runners

      - name: Publish catalog channel document
        run: |
          DOCUMENT="${{ steps.channel.outputs.document }}"
          SEQUENCE="${{ steps.channel.outputs.sequence }}"
          TAG="${{ steps.change.outputs.tag }}"
          README=${RUNNER_TEMP}/catalog-channel-readme.md
          INDEX=${RUNNER_TEMP}/catalog-channel-index

          cat > "$README" <<'MARKDOWN'
          # Catalog channel v1

          This branch is a machine-written discovery pointer. The catalog
          generation workflow is its only writer.

          The file `channel.json` carries the media type
          `application/vnd.agentstation.starmap.catalog-channel.v1+json`. It
          names the one immutable `catalog-<digest>` release that a client
          reads, and it carries build provenance that the client verifies
          before it decodes the document.

          Do not edit this branch by hand. A hand-written commit breaks the
          sequence that every client uses to reject a replayed pointer.
          MARKDOWN

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A push needs the current tip as the parent. An absent branch is the
          # first publication, and it becomes a root commit that carries no
          # source history.
          PARENT=""
          if git fetch --no-tags --depth=1 origin \
            "+refs/heads/${CHANNEL_BRANCH}:refs/remotes/origin/${CHANNEL_BRANCH}" 2>/dev/null; then
            PARENT="$(git rev-parse "refs/remotes/origin/${CHANNEL_BRANCH}")"
          fi

          # A private index leaves the working tree and the checked-out branch
          # untouched, so this commit reaches the channel branch alone.
          rm -f "$INDEX"
          export GIT_INDEX_FILE="$INDEX"
          if [ -n "$PARENT" ]; then
            git read-tree "$PARENT"
          else
            git read-tree --empty
            git update-index --add \
              --cacheinfo "100644,$(git hash-object -w "$README"),README.md"
          fi
          git update-index --add \
            --cacheinfo "100644,$(git hash-object -w "$DOCUMENT"),${CHANNEL_FILE}"
          TREE="$(git write-tree)"
          MESSAGE="catalog: publish channel sequence ${SEQUENCE} for ${TAG}"
          if [ -n "$PARENT" ]; then
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "$MESSAGE")"
          else
            COMMIT="$(git commit-tree "$TREE" -m "$MESSAGE")"
          fi
          unset GIT_INDEX_FILE

          if ! git push origin "${COMMIT}:refs/heads/${CHANNEL_BRANCH}"; then
            echo "::error::The push to ${CHANNEL_BRANCH} failed. A ruleset that denies GitHub Actions, or a commit that another run pushed first, causes this. Read the branch, then run this workflow again."
            exit 1
          fi

      - name: Verify published catalog channel document
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISHED_DIRECTORY=${RUNNER_TEMP}/catalog-channel-published
          rm -rf "$PUBLISHED_DIRECTORY"
          mkdir -p "$PUBLISHED_DIRECTORY"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${CHANNEL_BRANCH}:refs/remotes/origin/${CHANNEL_BRANCH}"
          git show "refs/remotes/origin/${CHANNEL_BRANCH}:${CHANNEL_FILE}" \
            > "${PUBLISHED_DIRECTORY}/${CHANNEL_FILE}"
          cmp "${{ steps.channel.outputs.document }}" "${PUBLISHED_DIRECTORY}/${CHANNEL_FILE}"
          test "$(jq -er .sequence "${PUBLISHED_DIRECTORY}/${CHANNEL_FILE}")" = "${{ steps.channel.outputs.sequence }}"
          test "$(jq -er .tag "${PUBLISHED_DIRECTORY}/${CHANNEL_FILE}")" = "${{ steps.change.outputs.tag }}"
          gh attestation verify \
            "${PUBLISHED_DIRECTORY}/${CHANNEL_FILE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/catalog-generation.yaml" \
            --deny-self-hosted-runners

      - name: Set up ORAS for optional catalog mirror
        if: ${{ steps.change.outputs.publish == 'true' && vars.STARMAP_CATALOG_OCI_MIRROR == 'true' }}
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Publish and verify optional OCI catalog mirror
        if: ${{ steps.change.outputs.publish == 'true' && vars.STARMAP_CATALOG_OCI_MIRROR == 'true' }}
        env:
          OCI_REPOSITORY: ${{ vars.STARMAP_CATALOG_OCI_REPOSITORY }}
        run: |
          DIRECTORY=$(realpath "${{ steps.assets.outputs.directory }}")
          GENERATION_ID=$(jq -er .generation_id catalog-release.json)
          ARCHIVE_CHECKSUM=$(jq -er .archive_checksum catalog-release.json)
          ARCHIVE_DIGEST=${ARCHIVE_CHECKSUM#sha256:}
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          OCI_REPOSITORY=${OCI_REPOSITORY:-ghcr.io/${OWNER}/starmap-catalog}
          OCI_TAG=sha256-${ARCHIVE_DIGEST}
          PUSH_REPORT=${RUNNER_TEMP}/catalog-oci-push.json
          PULL_REPORT=${RUNNER_TEMP}/catalog-oci-pull.json
          PULL_DIRECTORY=${RUNNER_TEMP}/catalog-oci-pull

          (
            cd "$DIRECTORY"
            oras push "${OCI_REPOSITORY}:${OCI_TAG}" \
              --artifact-type "application/vnd.agentstation.starmap.catalog-mirror.v1" \
              --annotation "ai.agentstation.starmap.generation=${GENERATION_ID}" \
              "starmap-catalog.tar.gz:application/vnd.agentstation.starmap.catalog-artifact.v1+tar+gzip" \
              "starmap-catalog.intoto.json:application/vnd.in-toto+json" \
              "starmap-catalog.tar.gz.sha256:text/plain" \
              --format json
          ) > "$PUSH_REPORT"

          REFERENCE=$(jq -er .reference "$PUSH_REPORT")
          test "${REFERENCE#*@sha256:}" != "$REFERENCE"
          rm -rf "$PULL_DIRECTORY"
          mkdir -p "$PULL_DIRECTORY"
          oras pull "$REFERENCE" --output "$PULL_DIRECTORY" --format json > "$PULL_REPORT"

          PULLED_ARCHIVE_CHECKSUM=$(jq -er \
            '.files[] | select(.mediaType == "application/vnd.agentstation.starmap.catalog-artifact.v1+tar+gzip") | .digest' \
            "$PULL_REPORT")
          test "$PULLED_ARCHIVE_CHECKSUM" = "$ARCHIVE_CHECKSUM"
          (cd "$PULL_DIRECTORY" && sha256sum --check "$DIRECTORY/starmap-catalog.tar.gz.sha256")
          cmp "$DIRECTORY/starmap-catalog.tar.gz" "$PULL_DIRECTORY/starmap-catalog.tar.gz"
          cmp "$DIRECTORY/starmap-catalog.intoto.json" "$PULL_DIRECTORY/starmap-catalog.intoto.json"
