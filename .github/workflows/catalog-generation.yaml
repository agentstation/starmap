name: Catalog Generation

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Pull Request]
    types: [completed]

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: catalog-generation-publisher
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.repository == 'agentstation/starmap' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'catalog/promotion/')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check publisher identity configuration
        env:
          CATALOG_APP_CLIENT_ID: ${{ vars.CATALOG_APP_CLIENT_ID }}
          CATALOG_APP_KEY_CONFIGURED: ${{ secrets.CATALOG_APP_PRIVATE_KEY != '' }}
        run: |
          test -n "$CATALOG_APP_CLIENT_ID" && test "$CATALOG_APP_KEY_CONFIGURED" = true || {
            echo "::error::Configure the catalog GitHub App before enabling publication."
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Select publication directory
        run: printf 'CATALOG_PUBLICATION_DIRECTORY=%s/catalog-publication\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Restore accepted or pending publication
        id: publication
        run: python3 scripts/catalog_publication.py inspect --directory "$CATALOG_PUBLICATION_DIRECTORY"

      - name: Refresh candidate catalog
        if: steps.publication.outputs.acquire == 'true'
        timeout-minutes: 75
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/catalog_publication.py prepare --directory "$CATALOG_PUBLICATION_DIRECTORY"

      - name: Validate candidate before publication
        if: steps.publication.outputs.acquire == 'true'
        run: python3 scripts/catalog_publication.py validate --directory "$CATALOG_PUBLICATION_DIRECTORY"

      - name: Retain candidate validation logs
        if: always() && steps.publication.outputs.acquire == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CATALOG_PUBLICATION_DIRECTORY }}/*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Attest exact publication inputs
        if: steps.publication.outputs.acquire == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ steps.publication.outputs.directory }}/*"

      - name: Retain preparation before public writes
        if: steps.publication.outputs.acquire == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-publication-${{ github.run_id }}
          path: ${{ steps.publication.outputs.directory }}
          retention-days: 90
          if-no-files-found: error

      - name: Record pending publication
        if: steps.publication.outputs.active == 'true'
        run: python3 scripts/catalog_publication.py begin --directory "$CATALOG_PUBLICATION_DIRECTORY"

      - name: Publish and verify immutable public inputs
        if: steps.publication.outputs.active == 'true'
        run: python3 scripts/catalog_publication.py publish --directory "$CATALOG_PUBLICATION_DIRECTORY"

      # Mint this token after acquisition because installation tokens expire after one hour.
      - name: Create promotion installation token
        if: steps.publication.outputs.active == 'true'
        id: promotion_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
          permission-actions: read
          permission-attestations: read
          permission-checks: read

      - name: Select promotion bot identity
        if: steps.publication.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ steps.promotion_token.outputs.token }}
          CATALOG_APP_SLUG: ${{ steps.promotion_token.outputs.app-slug }}
        run: |
          [[ "$CATALOG_APP_SLUG" =~ ^[a-z0-9-]+$ ]]
          BOT_NAME="${CATALOG_APP_SLUG}[bot]"
          BOT_ID=$(gh api "users/${BOT_NAME}" --jq .id)
          [[ "$BOT_ID" =~ ^[0-9]+$ ]]
          printf 'CATALOG_BOT_NAME=%s\n' "$BOT_NAME" >> "$GITHUB_ENV"
          printf 'CATALOG_BOT_EMAIL=%s+%s@users.noreply.github.com\n' "$BOT_ID" "$BOT_NAME" >> "$GITHUB_ENV"

      - name: Promote exact input through checked pull request
        if: steps.publication.outputs.active == 'true'
        id: promotion
        env:
          GH_TOKEN: ${{ steps.promotion_token.outputs.token }}
        run: python3 scripts/catalog_publication.py promote --directory "$CATALOG_PUBLICATION_DIRECTORY"

      - name: Stage channels after verified merge
        if: steps.promotion.outputs.ready == 'true'
        id: channels
        env:
          CATALOG_PROMOTED_COMMIT: ${{ steps.promotion.outputs.source_commit }}
          CATALOG_PROMOTED_CHECKOUT: ${{ steps.promotion.outputs.checkout }}
        run: python3 scripts/catalog_publication.py channels --directory "$CATALOG_PUBLICATION_DIRECTORY"

      - name: Attest both discovery channels
        if: steps.promotion.outputs.ready == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ steps.channels.outputs.directory }}/*.json"

      - name: Publish and verify both discovery channels
        if: steps.promotion.outputs.ready == 'true'
        id: completed
        run: python3 scripts/catalog_publication.py finish --directory "$CATALOG_PUBLICATION_DIRECTORY"

      - name: Report publication state
        if: steps.publication.outputs.active == 'true'
        env:
          PUBLICATION_STATUS: ${{ steps.completed.outputs.status || steps.promotion.outputs.status }}
          PUBLICATION_PULL_REQUEST: ${{ steps.promotion.outputs.pull_request }}
        run: |
          printf 'Catalog publication: %s\n' "$PUBLICATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PUBLICATION_PULL_REQUEST" ]; then
            printf 'Promotion pull request: %s\n' "$PUBLICATION_PULL_REQUEST" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up ORAS for optional catalog mirror
        if: ${{ steps.promotion.outputs.ready == 'true' && vars.STARMAP_CATALOG_OCI_MIRROR == 'true' }}
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Publish and verify optional OCI catalog mirror
        if: ${{ steps.promotion.outputs.ready == 'true' && vars.STARMAP_CATALOG_OCI_MIRROR == 'true' }}
        env:
          OCI_REPOSITORY: ${{ vars.STARMAP_CATALOG_OCI_REPOSITORY }}
        run: |
          DIRECTORY="${CATALOG_PUBLICATION_DIRECTORY}/verified-assets"
          RECORD="${CATALOG_PUBLICATION_DIRECTORY}/stage/pending.json"
          GENERATION_ID=$(jq -er .generation_id "$RECORD")
          ARCHIVE_CHECKSUM=$(jq -er .archive_checksum "$RECORD")
          ARCHIVE_DIGEST=${ARCHIVE_CHECKSUM#sha256:}
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          OCI_REPOSITORY=${OCI_REPOSITORY:-ghcr.io/${OWNER}/starmap-catalog}
          OCI_TAG=sha256-${ARCHIVE_DIGEST}
          PUSH_REPORT=${RUNNER_TEMP}/catalog-oci-push.json
          PULL_REPORT=${RUNNER_TEMP}/catalog-oci-pull.json
          PULL_DIRECTORY=${RUNNER_TEMP}/catalog-oci-pull

          (
            cd "$DIRECTORY"
            oras push "${OCI_REPOSITORY}:${OCI_TAG}" \
              --artifact-type "application/vnd.agentstation.starmap.catalog-mirror.v1" \
              --annotation "ai.agentstation.starmap.generation=${GENERATION_ID}" \
              "starmap-catalog.tar.gz:application/vnd.agentstation.starmap.catalog-artifact.v1+tar+gzip" \
              "starmap-catalog.intoto.json:application/vnd.in-toto+json" \
              "starmap-catalog.tar.gz.sha256:text/plain" \
              --format json
          ) > "$PUSH_REPORT"

          REFERENCE=$(jq -er .reference "$PUSH_REPORT")
          test "${REFERENCE#*@sha256:}" != "$REFERENCE"
          rm -rf "$PULL_DIRECTORY"
          mkdir -p "$PULL_DIRECTORY"
          oras pull "$REFERENCE" --output "$PULL_DIRECTORY" --format json > "$PULL_REPORT"

          PULLED_ARCHIVE_CHECKSUM=$(jq -er \
            '.files[] | select(.mediaType == "application/vnd.agentstation.starmap.catalog-artifact.v1+tar+gzip") | .digest' \
            "$PULL_REPORT")
          test "$PULLED_ARCHIVE_CHECKSUM" = "$ARCHIVE_CHECKSUM"
          (cd "$PULL_DIRECTORY" && sha256sum --check "$DIRECTORY/starmap-catalog.tar.gz.sha256")
          cmp "$DIRECTORY/starmap-catalog.tar.gz" "$PULL_DIRECTORY/starmap-catalog.tar.gz"
          cmp "$DIRECTORY/starmap-catalog.intoto.json" "$PULL_DIRECTORY/starmap-catalog.intoto.json"
