name: Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.1

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  object-fixture:
    name: Build pinned object fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up qualification Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build MinIO fixture from pinned source
        run: |
          mkdir -p "$RUNNER_TEMP/starmap-object-bin"
          GOBIN="$RUNNER_TEMP/starmap-object-bin" CGO_ENABLED=0 \
            go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          go version -m "$RUNNER_TEMP/starmap-object-bin/minio"
      - name: Share object fixture with storage jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starmap-minio-fixture
          path: ${{ runner.temp }}/starmap-object-bin/minio
          retention-days: 1

  coordinated-storage:
    name: Coordinated Storage ${{ matrix.server }}
    needs: object-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [valkey, redis]
        include:
          - server: valkey
            image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
            cli: valkey-cli
          - server: redis
            image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
            cli: redis-cli
    env:
      GOTOOLCHAIN: local
      COORDINATION_IMAGE: ${{ matrix.image }}
      COORDINATION_CLI: ${{ matrix.cli }}
      STARMAP_TEST_VALKEY_ADDRESS: 127.0.0.1:6379
      STARMAP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      STARMAP_TEST_COORDINATION_SERVER_CHANGES: '1'
      STARMAP_TEST_COORDINATION_CONTAINER: starmap-test-coordination
      STARMAP_TEST_OBJECT_CONTAINER: starmap-test-objects
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up qualification Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Download pinned object fixture
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: starmap-minio-fixture
          path: ${{ runner.temp }}/starmap-object-bin
      - name: Start isolated storage services
        run: |
          mkdir -p "$RUNNER_TEMP/starmap-object-data"
          chmod +x "$RUNNER_TEMP/starmap-object-bin/minio"
          docker run -d --name "$STARMAP_TEST_COORDINATION_CONTAINER" \
            -p 127.0.0.1:6379:6379 "$COORDINATION_IMAGE" \
            --save '' --appendonly yes --appendfsync always --maxmemory-policy noeviction
          docker run -d --name "$STARMAP_TEST_OBJECT_CONTAINER" \
            -p 127.0.0.1:9000:9000 \
            -v "$RUNNER_TEMP/starmap-object-bin/minio:/usr/local/bin/minio:ro" \
            -v "$RUNNER_TEMP/starmap-object-data:/data" \
            -e MINIO_ROOT_USER=starmap-test \
            -e MINIO_ROOT_PASSWORD=starmap-test-secret-only \
            busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e \
            /usr/local/bin/minio server /data
          for attempt in {1..60}; do
            if docker exec "$STARMAP_TEST_COORDINATION_CONTAINER" "$COORDINATION_CLI" ping && \
               curl --fail --silent "$STARMAP_TEST_S3_ENDPOINT/minio/health/ready"; then
              exit 0
            fi
            sleep 1
          done
          echo "storage services did not become ready after $attempt attempts" >&2
          docker logs "$STARMAP_TEST_OBJECT_CONTAINER" >&2 || true
          docker inspect "$STARMAP_TEST_OBJECT_CONTAINER" --format '{{.State.Status}}: {{.State.ExitCode}}' >&2 || true
          exit 1
      - name: Qualify native storage and process recovery
        run: go test -race -json -count=1 -timeout=5m ./pkg/catalogs/storage/valkey > "$RUNNER_TEMP/coordinated-storage.jsonl"
      - name: Retain coordinated storage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coordinated-storage-${{ matrix.server }}
          path: ${{ runner.temp }}/coordinated-storage.jsonl
          if-no-files-found: warn
      - name: Remove isolated storage services
        if: always()
        run: docker rm -f "$STARMAP_TEST_COORDINATION_CONTAINER" "$STARMAP_TEST_OBJECT_CONTAINER"

  constructor-network:
    name: Constructor Network Passivity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up qualification Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify passive constructors and the socket control
        run: python3 scripts/constructor_network.py > "$RUNNER_TEMP/constructor-network.json"
      - name: Retain constructor network evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constructor-network-linux-amd64
          path: ${{ runner.temp }}/constructor-network.json
          if-no-files-found: error

  cold-server:
    name: Offline Server Persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up qualification Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify cold offline startup and restart
        run: python3 scripts/cold_server.py > "$RUNNER_TEMP/cold-server.json"
      - name: Retain offline server evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-server-linux-amd64
          path: ${{ runner.temp }}/cold-server.json
          if-no-files-found: error

  verification:
    name: Verification Gate
    needs: [verification-checks, verification-tests, verification-capacity, native-publication]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification result
        env:
          CHECKS: ${{ needs.verification-checks.result }}
          TESTS: ${{ needs.verification-tests.result }}
          CAPACITY: ${{ needs.verification-capacity.result }}
          PUBLICATION: ${{ needs.native-publication.result }}
        run: |
          test "$CHECKS" = success && test "$TESTS" = success && test "$CAPACITY" = success && test "$PUBLICATION" = success

  verification-checks:
    name: Verification Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Install pinned verification tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0
      - name: Checkout pinned technical-writing skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentstation/skills
          ref: dc9948f59089426c7dd077e41469104ec788cf7f
          path: .ci/agentstation-skills
          persist-credentials: false
      - name: Run verification checks before suites
        env:
          TECHNICAL_WRITING: ${{ github.workspace }}/.ci/agentstation-skills/technical-writing/scripts/technical-writing
          STARMAP_VERIFY_EVENTS_DIR: ${{ runner.temp }}/verification-events
        run: make verify-checks
      - name: Retain early workflow contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-tests-race-checks
          path: ${{ runner.temp }}/verification-events/
          if-no-files-found: warn

  verification-tests:
    name: Go 1.27.1 race ${{ matrix.label }}
    needs: verification-checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: runtime, shard: 1, label: runtime-1}
          - {group: runtime, shard: 2, label: runtime-2}
          - {group: runtime, shard: 3, label: runtime-3}
          - {group: client, shard: 0, label: client}
          - {group: application, shard: 1, label: application-1}
          - {group: application, shard: 2, label: application-2}
          - {group: application, shard: 3, label: application-3}
          - {group: contracts, shard: 0, label: contracts}
    env:
      GOTOOLCHAIN: local
      CATALOG_GIT_FIXTURE_REQUIRED: '1'
      STARMAP_PUBLIC_FIXTURE_REQUIRED: '1'
      TEST_SUITE: 'race'
      TEST_GROUP: ${{ matrix.group }}
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up selected Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Set up pinned Bun for Git acquisition fixtures
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
          no-cache: true
      - name: Prepare verified public catalog fixture
        timeout-minutes: 2
        run: python3 scripts/prepare_public_catalog_fixture.py
      - name: Run complete selected test group
        run: python3 scripts/verification_tests.py "$TEST_SUITE" --group "$TEST_GROUP" --shard "$TEST_SHARD" --output "$RUNNER_TEMP/go-test-events.jsonl"
      - name: Test pure-Go external consumer
        if: matrix.group == 'client'
        env:
          CGO_ENABLED: 0
        run: make test-consumer-deps
      - name: Retain test timings and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-tests-race-${{ matrix.label }}
          path: ${{ runner.temp }}/go-test-events.*
          if-no-files-found: error

  verification-capacity:
    name: Full Catalog Capacity
    needs: verification-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Run full public catalog capacity
        run: python3 scripts/verification_tests.py capacity --output "$RUNNER_TEMP/go-capacity-events.jsonl"
      - name: Retain capacity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-full-catalog-capacity
          path: ${{ runner.temp }}/go-capacity-events.jsonl
          if-no-files-found: error

  security-reliability:
    name: Security & Reliability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

      - name: Run bounded fuzz smoke
        run: |
          go test ./internal/sources/modelsdev -run '^$' -fuzz '^FuzzParseAPIDataNoPanic$' -fuzztime=10s
          go test ./pkg/catalogs -run '^$' -fuzz '^FuzzSourceExtensionNoPanic$' -fuzztime=10s
          go test ./internal/catalog/reconciler -run '^$' -fuzz '^FuzzReconciliationNoPanic$' -fuzztime=10s

      - name: Run migration and persistence fault fixtures
        run: |
          go test ./pkg/catalogs ./pkg/catalogs/storage -race -run 'Migration|Rollback|Fault|Corrupt|ReopensCurrent' -count=1

  # This job adds supply-chain evidence. It is not a required status check
  # because it needs the GitHub API. An upstream outage must not block merges.
  # The reviewed-pin allowlist in internal/ciworkflow remains the blocking control.
  action-pins:
    name: Action Pin Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify action pins resolve to their advertised releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make verify-action-pins

  native-runtime:
    name: Runtime ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.os == 'windows' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      CATALOG_GIT_FIXTURE_REQUIRED: '1'
      STARMAP_PUBLIC_FIXTURE_REQUIRED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up qualification Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Set up pinned Bun for Git acquisition fixtures
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
          no-cache: true
      - name: Prepare verified public catalog fixture
        timeout-minutes: 2
        shell: bash
        run: python3 scripts/prepare_public_catalog_fixture.py
      - name: Prepare Windows time-service fixture
        if: matrix.os == 'windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path native-evidence -Force | Out-Null
          $before = (Get-Service W32Time).Status.ToString()
          Start-Service W32Time
          $service = Get-Service W32Time
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          @{before=$before; after=$service.Status.ToString(); action='Start existing time service on this disposable CI runner'} |
            ConvertTo-Json | Set-Content native-evidence/windows-time-service.json
          $nativeStatus = & "$env:SystemRoot\System32\w32tm.exe" /query /status /verbose 2>&1
          $nativeStatusExit = $LASTEXITCODE
          $nativeStatus | Set-Content native-evidence/windows-time-status.log
          & "$env:SystemRoot\System32\whoami.exe" /priv | Set-Content native-evidence/windows-time-privileges.log
          @{status_exit=$nativeStatusExit; privilege_exit=$LASTEXITCODE; scope='read-only local diagnostics'} |
            ConvertTo-Json | Set-Content native-evidence/windows-time-access.json
          'STARMAP_WINDOWS_CLOCK_FIXTURE_REQUIRED=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test Windows time-service access before the full suite
        id: windows_clock_preflight
        if: matrix.os == 'windows'
        timeout-minutes: 5
        shell: bash
        run: |
          go test -json -count=1 -timeout=2m -run '^TestWindows(LocalTimeService|PrincipalDiagnostics|SecurityLifecycle|SecurityPacketPrivacy)$' ./pkg/catalogs/permission/hostclock/internal/w32timerpc > native-evidence/windows-clock.jsonl
      - name: Diagnose Windows time-service privilege after an access failure
        if: failure() && matrix.os == 'windows' && steps.windows_clock_preflight.outcome == 'failure'
        timeout-minutes: 5
        shell: bash
        env:
          STARMAP_WINDOWS_CLOCK_PRIVILEGE_PROBE: '1'
        run: |
          go test -json -count=1 -timeout=2m -run '^TestWindowsTimeServicePreparedPrivilege$' ./pkg/catalogs/permission/hostclock/internal/w32timerpc > native-evidence/windows-clock-privilege-probe.jsonl
      - name: Test native filesystem recovery before the full suite
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p native-evidence
          go test -json -count=1 -timeout=5m -run '^Test(WorkspaceEmptyLockedRecords|PrivateEmptyRecordReadWhileExclusivelyLocked|PrivatePublicationPreservesChangedRecords|PreparationCleanupPreservesOperatorChanges|WorkspaceWriterReplacementStopsPublication|WorkspaceWriterReplacementStopsJournalPhases|LegacyStoreLockCancellationPreservesStore|MigrateLegacyLayoutRelocatesStoreAndProjectsCurrent|LegacyRollbackPreservesOperatorSidecars|RelocationPreparationClosesHandlesAfterCleanupConflict|RequiredBaselineWriteFailurePreventsRuntimeStartup|CredentialPolicyRejectsInvalidInstallationMarkersBeforeWrites)$' ./internal/privatefiles ./internal/catalog/workspace ./internal/cli/app > native-evidence/filesystem-preflight.jsonl
      - name: Test Windows file publication with race instrumentation
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        timeout-minutes: 10
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test -race -json -count=1 -timeout=5m ./internal/filepublish ./internal/privatefiles > native-evidence/filesystem-race.jsonl
      - name: Test native runtime, configuration, and paths
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p native-evidence
          go version > native-evidence/toolchain.txt
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH CGO_ENABLED >> native-evidence/toolchain.txt
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOHOSTOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
          native_packages=(. ./runtime ./server ./server/administration ./internal/server/middleware ./internal/cli/commands/serve ./internal/auth ./internal/bootstrap ./internal/filepublish ./internal/privatefiles ./internal/runtimeacl/windows ./internal/sources/github ./internal/cli/app ./pkg/productfiles ./pkg/productpaths ./pkg/productpaths/policy ./pkg/catalogs/storage ./pkg/catalogs/permission/... ./internal/catalog/workspace ./internal/test/gitfixture)
          if [ "$EXPECTED_OS" = windows ]; then
            native_packages+=(./internal/test/windowstoken)
          fi
          # The complete runtime suite uses the repository verification limit.
          go test -json -count=1 -timeout=30m -p=1 "${native_packages[@]}" > native-evidence/tests.jsonl
      - name: Test administrator-owned Linux configuration
        if: matrix.os == 'linux'
        shell: bash
        run: |
          go test -c -o native-evidence/privatefiles-root.test ./internal/privatefiles
          sudo ./native-evidence/privatefiles-root.test -test.run '^TestServiceConfigurationAdministratorOwnedRead$' -test.v > native-evidence/service-owner.txt
          rm native-evidence/privatefiles-root.test
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-runtime-${{ matrix.runner }}
          path: native-evidence/
          if-no-files-found: error

  native-publication:
    name: Publication ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.os == 'windows' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      CATALOG_GIT_FIXTURE_REQUIRED: '1'
      STARMAP_PUBLIC_FIXTURE_REQUIRED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up qualification Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Set up pinned Bun for Git acquisition fixtures
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
          no-cache: true
      - name: Prepare verified public catalog fixture
        timeout-minutes: 2
        shell: bash
        run: python3 scripts/prepare_public_catalog_fixture.py
      - name: Verify native publication toolchain
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p native-evidence
          go version > native-evidence/toolchain.txt
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH CGO_ENABLED >> native-evidence/toolchain.txt
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOHOSTOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
      - name: Test real Git acquisition and mandatory tools
        shell: bash
        run: |
          go test -json -count=1 -timeout=5m -run '^TestRealPinnedGitSourceAcquisition$|^TestRequiredGitFixtureToolsCannotSkip$' ./acquisition > native-evidence/git-acquisition.jsonl
      - name: Test provider and metadata artifact publication
        shell: bash
        run: |
          go test -json -count=1 -timeout=15m -run '^Test(Git)?PublisherStages(ChangingProviderAndMetadataIngestion|AllProviderAndMetadataIngestion)$' ./cmd/starmap-catalog-release > native-evidence/publisher-ingestion.jsonl
      - name: Test catalog publication preparation and recovery
        shell: bash
        run: |
          go test -json -count=1 -timeout=30m ./internal/catalog/publication ./cmd/starmap-catalog-publish > native-evidence/publication-preparation.jsonl
      - name: Retain native publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-publication-${{ matrix.runner }}
          path: native-evidence/
          if-no-files-found: error
