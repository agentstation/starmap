name: Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum supported Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true

      - name: Test minimum supported Go version
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Test minimum supported external consumer
        env:
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
        run: make test-consumer-deps

      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install pinned verification tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Run verification gate
        run: make verify

  security-reliability:
    name: Security & Reliability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

      - name: Run bounded fuzz smoke
        run: |
          go test ./internal/sources/modelsdev -run '^$' -fuzz '^FuzzParseAPIDataNoPanic$' -fuzztime=10s
          go test ./pkg/catalogs -run '^$' -fuzz '^FuzzSourceExtensionNoPanic$' -fuzztime=10s
          go test ./internal/catalog/reconciler -run '^$' -fuzz '^FuzzReconciliationNoPanic$' -fuzztime=10s

      - name: Run migration and persistence fault fixtures
        run: |
          go test ./pkg/catalogs ./pkg/catalogs/storage -race -run 'Migration|Rollback|Fault|Corrupt|ReopensCurrent' -count=1

  # Additive supply-chain evidence. This job is deliberately not a required
  # status check: it needs the GitHub API, so an upstream outage must not block
  # merges, and the reviewed-pin allowlist in internal/ciworkflow remains the
  # blocking control.
  action-pins:
    name: Action Pin Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify action pins resolve to their advertised releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make verify-action-pins
