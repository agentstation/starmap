name: Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  constructor-network:
    name: Constructor Network Passivity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum supported Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Verify passive constructors and the socket control
        run: python3 scripts/constructor_network.py > "$RUNNER_TEMP/constructor-network.json"
      - name: Retain constructor network evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constructor-network-linux-amd64
          path: ${{ runner.temp }}/constructor-network.json
          if-no-files-found: error

  cold-server:
    name: Offline Server Persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum supported Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Verify cold offline startup and restart
        run: python3 scripts/cold_server.py > "$RUNNER_TEMP/cold-server.json"
      - name: Retain offline server evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-server-linux-amd64
          path: ${{ runner.temp }}/cold-server.json
          if-no-files-found: error

  verification:
    name: Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum supported Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true

      - name: Test minimum supported Go version
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Test minimum supported external consumer
        env:
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
        run: make test-consumer-deps

      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install pinned verification tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Checkout pinned technical-writing skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentstation/skills
          ref: dc9948f59089426c7dd077e41469104ec788cf7f
          path: .ci/agentstation-skills
          persist-credentials: false

      - name: Run verification gate
        env:
          TECHNICAL_WRITING: ${{ github.workspace }}/.ci/agentstation-skills/technical-writing/scripts/technical-writing
        run: make verify

  security-reliability:
    name: Security & Reliability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

      - name: Run bounded fuzz smoke
        run: |
          go test ./internal/sources/modelsdev -run '^$' -fuzz '^FuzzParseAPIDataNoPanic$' -fuzztime=10s
          go test ./pkg/catalogs -run '^$' -fuzz '^FuzzSourceExtensionNoPanic$' -fuzztime=10s
          go test ./internal/catalog/reconciler -run '^$' -fuzz '^FuzzReconciliationNoPanic$' -fuzztime=10s

      - name: Run migration and persistence fault fixtures
        run: |
          go test ./pkg/catalogs ./pkg/catalogs/storage -race -run 'Migration|Rollback|Fault|Corrupt|ReopensCurrent' -count=1

  # This job adds supply-chain evidence. It is not a required status check
  # because it needs the GitHub API. An upstream outage must not block merges.
  # The reviewed-pin allowlist in internal/ciworkflow remains the blocking control.
  action-pins:
    name: Action Pin Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify action pins resolve to their advertised releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make verify-action-pins

  native-runtime:
    name: Runtime ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum supported Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Test native runtime, configuration, and paths
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p native-evidence
          go version > native-evidence/toolchain.txt
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH CGO_ENABLED >> native-evidence/toolchain.txt
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOHOSTOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
          native_packages=(. ./runtime ./internal/bootstrap ./internal/filepublish ./internal/privatefiles ./internal/runtimeacl/windows ./internal/sources/github ./internal/cli/app ./pkg/productpaths ./pkg/productpaths/policy ./pkg/catalogs/storage ./internal/catalog/workspace)
          if [ "$EXPECTED_OS" = windows ]; then
            native_packages+=(./internal/test/windowstoken)
          fi
          go test -json -count=1 -timeout=10m "${native_packages[@]}" > native-evidence/tests.jsonl
      - name: Test administrator-owned Linux configuration
        if: matrix.os == 'linux'
        shell: bash
        run: |
          go test -c -o native-evidence/privatefiles-root.test ./internal/privatefiles
          sudo ./native-evidence/privatefiles-root.test -test.run '^TestServiceConfigurationAdministratorOwnedRead$' -test.v > native-evidence/service-owner.txt
          rm native-evidence/privatefiles-root.test
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-runtime-${{ matrix.runner }}
          path: native-evidence/
          if-no-files-found: error
